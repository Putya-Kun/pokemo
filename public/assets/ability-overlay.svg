<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 586" width="420" height="586">
  <defs>
    <!-- Metallic Outer Border Gradient -->
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Glossy Red Pill Gradient -->
    <linearGradient id="redPill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Silver Tab Gradient -->
    <linearGradient id="silverTab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Badge Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ability Badge Overlay Layer (Full Card Scale) -->
  <g filter="url(#badgeShadow)">
    <!-- Main Outer Pill Frame -->
    <rect x="27" y="315" width="102" height="22" rx="11" fill="url(#silverBorder)"/>
    <rect x="28.5" y="316.5" width="99" height="19" rx="9.5" fill="url(#redPill)"/>

    <!-- Inner Highlight Sheen -->
    <path d="M 38 317.5 L 118 317.5 C 122 317.5 124 319.5 123 322 L 34 322 C 34.5 319.5 36.5 317.5 38 317.5 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Right Silver Notch Tab for 「とくせい」 -->
    <path d="M 92 316.5 L 118 316.5 C 123 316.5 127 320.5 127 326 C 127 331.5 123 335.5 118 335.5 L 96 335.5 Z" fill="url(#silverTab)"/>

    <!-- Text: 特 性 -->
    <text x="39" y="330.5" font-family="'Zen Kaku Gothic New', 'M PLUS 1p', 'Hiragino Kaku Gothic ProN', sans-serif" font-weight="900" font-size="12" font-style="italic" fill="#ffffff" letter-spacing="2">特 性</text>

    <!-- Text: とくせい -->
    <text x="96" y="330" font-family="'Zen Kaku Gothic New', sans-serif" font-weight="800" font-size="7.5" font-style="italic" fill="#0f172a" letter-spacing="-0.5">とくせい</text>
  </g>
</svg>
